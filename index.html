<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stellar RPC Full-History — Benchmark Reports</title>
<link rel="stylesheet" href="styles.css?v=fcf11a83">
</head>
<body>

<!-- The toolbar serves two states, toggled by app.js: the run-index listing
     shows only the global pages (latency model, tx submission); a run report
     shows the run navigation (all runs, selector, summary) instead. -->
<div class="toolbar">
  <span class="brand">Stellar RPC v2 · Full-History Storage Engine</span>
  <span class="spacer"></span>
  <a id="all-runs-link" href="index.html" class="theme-toggle" hidden aria-label="Back to the run index">← All runs</a>
  <label for="run-select" id="run-select-label" hidden>Run</label>
  <select id="run-select" class="run-select" hidden aria-label="Select benchmark run"></select>
  <a id="summary-link" href="summary.html" class="theme-toggle" hidden aria-label="Open this run's summary">Summary →</a>
  <a id="latency-link" href="latency-model.html" class="theme-toggle" aria-label="Open the end-to-end latency model">Latency model →</a>
  <a id="txsub-link" href="tx-submission.html" class="theme-toggle" aria-label="Open the transaction-submission results">Tx submission →</a>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle color theme">◐ Theme</button>
</div>

<div class="wrap">
  <main id="report">
    <div class="loading">Loading benchmark runs…</div>
  </main>
</div>

<div class="tip" id="tip" role="status" aria-live="off"></div>

<script src="app.js?v=ef8c69e9"></script>
</body>
</html>
