<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transaction Submission — Stellar RPC Full-History</title>
<link rel="stylesheet" href="styles.css?v=c036259e">
<style>
  /* Page-specific styles, layered on the viewer's design tokens (styles.css).
     Kept in-page so the shared stylesheet stays the viewer's alone. */

  .mast-sub a, .footer a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; }
  .mast-sub a:hover, .footer a:hover { border-bottom-color: var(--accent); }

  /* scope pill on section headings: which clock the numbers are on */
  .scope-tag {
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; letter-spacing: 0.08em;
    text-transform: uppercase; white-space: nowrap;
    color: var(--ink-2); border: 1px solid var(--border);
    background: color-mix(in srgb, var(--ink) 5%, transparent);
    border-radius: 999px; padding: 3px 10px;
  }
  /* the sum spelled out under a tile value */
  .tile-eq {
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px;
    color: var(--ink-2); font-variant-numeric: tabular-nums; margin: 0 0 6px;
  }

  /* --- horizontal CSS bar rows (headline p99) --- */
  .cbar { display: grid; grid-template-columns: minmax(130px, 170px) 1fr 76px; gap: 6px 12px; align-items: center; margin: 14px 0 6px; }
  .cbar-lab { font-size: 13px; font-weight: 550; color: var(--ink); line-height: 1.3; }
  .cbar-lab small { display: block; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cbar-track { background: var(--page); border: 1px solid var(--border); border-radius: 6px; height: 26px; overflow: hidden; }
  .cbar-fill { height: 100%; background: var(--accent); border-radius: 5px 0 0 5px; min-width: 2px; }
  .cbar-val { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }

  /* --- stacked mean split bars --- */
  .split-rows { margin: 14px 0 4px; }
  .split-row { margin: 14px 0; }
  .split-lab { font-size: 13px; font-weight: 550; color: var(--ink); margin-bottom: 5px; }
  .split-lab .mono-sub { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 8px; }
  .ts-splitbar { display: flex; height: 32px; border-radius: 7px; overflow: hidden; background: var(--page); border: 1px solid var(--border); }
  .ts-seg { display: flex; align-items: center; justify-content: center; min-width: 2px; overflow: hidden; }
  .ts-seg-lab { font: 650 10.5px/1 ui-monospace, Menlo, Consolas, monospace; color: #fff; white-space: nowrap; padding: 0 6px; text-shadow: 0 1px 2px rgba(0,0,0,0.35); font-variant-numeric: tabular-nums; }
  .ts-rest { flex: 1 1 auto; background: transparent; }

  /* --- tables: primary quantile emphasis --- */
  table.data td.ts-p99 { color: var(--accent); font-weight: 700; font-size: 13.5px; }
  table.data th.ts-p99h { color: var(--accent); font-weight: 700; }

  ul.bundle-files { margin: 6px 0 0; padding-left: 22px; max-width: 46em; }
  ul.bundle-files li { color: var(--ink-2); line-height: 1.6; margin: 4px 0; }

  .loading, .error-box { font-size: 13.5px; }
  .error-box { border: 1px solid var(--border); border-left: 3px solid var(--s6); background: var(--surface); border-radius: 8px; padding: 12px 16px; margin: 20px 0 0; max-width: 52em; }
</style>
</head>
<body>

<div class="toolbar">
  <span class="brand">Stellar RPC v2 · Full-History Storage Engine</span>
  <span class="spacer"></span>
  <a href="./" class="theme-toggle" aria-label="Back to benchmark reports">← Reports</a>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle color theme">◐ Theme</button>
</div>

<div class="wrap">
  <main id="report">
    <div class="loading">Loading transaction-submission results…</div>
  </main>
</div>

<script src="txsub.js?v=e5a7e88b"></script>
</body>
</html>
