name: Deploy site

# Sync main:/docs to the gh-pages branch, which GitHub Pages serves.
# "Deploy = commit to main" still holds — this runs on every docs/ change.
# PR previews live under gh-pages:/pr-preview/ (see pr-preview.yml) and are
# preserved via clean-exclude.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

concurrency: gh-pages-sync

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache-bust viewer assets
        # Shared with pr-preview.yml so the two can't drift over which assets get
        # stamped; the script documents the why. Runs on the ephemeral checkout
        # only — main stays unstamped, so `make serve` and the smoke test are
        # unaffected.
        run: .github/scripts/cache-bust.sh

      - name: Deploy docs/ to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          clean-exclude: pr-preview
          force: false
