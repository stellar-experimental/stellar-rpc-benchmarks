# End-to-end campaign config (cmd/campaign/e2e_test.go): the smallest shape
# that still exercises all four suites — both ingest tiers, both query tiers —
# over one chunk of one generated fixture, twice. A fixture dataset is the only
# kind that needs no network and no operator-supplied pack tree, so the whole
# campaign runs against the stub binary alone.
name = "e2e"
ingest = "both"
query = true
runs = 2
close_interval = "0"

# The query legs are paced at phase-1 RPS floors. An unpaced campaign has no
# block time to derive the phase from, so it states the phase outright. The
# dataset name carries the load profile: sac-6000 targets the sac floors.
phase = 1
query_duration = "1s"

[[dataset]]
name = "sac-6000"
kind = "fixture"
ledgers = 10000
chunks = [1]
